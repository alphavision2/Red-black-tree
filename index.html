<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red-Black Tree Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="heading">
      <h1>Red-Black Tree Visualizer</h1>
      <p>CLRS Insertion Algorithm — Step-by-Step Demonstration</p>
    </header>

    <section class="controls">
      <div class="control-group">
        <label for="keyInput">Enter keys (comma or space separated):</label>
        <input type="text" id="keyInput" placeholder="e.g. 10 20 30 40 50">
        <button id="insertBtn" class="btn btn-primary">Insert</button>
        <button id="demoBtn" class="btn btn-success">Run CLRS Demo</button>
        <button id="resetBtn" class="btn btn-secondary">Reset</button>
        <button id="stepBtn" class="btn btn-warning">Step</button>
        <label class="speed">
          Speed:
          <input type="range" id="speedRange" min="200" max="2000" value="800">
          <span id="speedVal">800 ms</span>
        </label>
      </div>
    </section>

    <section class="main">
      <div class="tree-panel">
        <h2>Tree</h2>
        <div id="treeContainer">
          <svg id="treeSvg" width="100%" height="100%"></svg>
        </div>
      </div>
      <aside class="operation-panel">
        <h2>Operation Log</h2>
        <div id="log" class="log"></div>
      </aside>
    </section>

    <footer class="legend">
      <span class="legend-item"><span class="dot red"></span> Red Node</span>
      <span class="legend-item"><span class="dot black"></span> Black Node</span>
      <span class="legend-item"><span class="dot nil"></span> NIL (Leaf)</span>
      <span class="legend-item"><span class="dot sel"></span> Selected</span>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
